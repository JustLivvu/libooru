user www;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 127.0.0.1:40001;
        listen [::1]:40001;
        server_name localhost;

        root /home/admin/Homelab/Services/libooru;
        index index.php;
        client_max_body_size 100m;

        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header CF-Connecting-IP;

        location ^~ /data/ {
            return 404;
        }

        location ^~ /static/ {
            alias /home/admin/Homelab/Services/libooru/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /site-assets/ {
            alias /home/admin/Homelab/Services/libooru/data/site-assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.php {
            include /usr/local/etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/admin/Homelab/Services/libooru/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/var/run/php-fpm-libooru.sock;
            fastcgi_read_timeout 300s;
        }

        location ~ \.php$ {
            return 404;
        }

        location / {
            include /usr/local/etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/admin/Homelab/Services/libooru/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/var/run/php-fpm-libooru.sock;
            fastcgi_read_timeout 300s;
        }
    }
}
